version: 2
updates:
  # The catalog (gradle/libs.versions.toml) is shared by the root build and the
  # included kimney-gradle-plugin build, so the root directory covers both.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # kimney builds against one Kotlin and tests on the list in
      # gradle.properties; moving it is a spec of its own (AGENTS.md).
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.jvm"
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
