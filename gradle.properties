# Every Kotlin compile and every detekt run with types loads compiler classes
# into the daemon. At 1g the metaspace filled: a 17-hour daemon measured at
# 99.3% of it (2026-09-24) turned 19-second builds into ten-minute ones. These
# settings also differ from pelican's, so the two builds stop sharing a daemon.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=2g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Every Kotlin the compiler tests run on in CI, oldest first. The Gradle plugin
# accepts any Kotlin with the catalog's major and minor and warns past the last
# of these (spec 0019). BuildWorkflowTest holds the CI matrix to this list.
kimney.kotlinTested=2.4.0,2.4.10,2.4.20

group=io.github.matthewjones372
version=0.4.0-SNAPSHOT

# Publishing goes to the Central Portal. An upload is left staged rather than
# released, so a bad one can be dropped. Signing is required for a release
# version and skipped for a -SNAPSHOT, so publishToMavenLocal needs no key.
mavenCentralPublishing=true
signAllPublications=true
