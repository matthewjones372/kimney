[versions]
# The compiler plugin API is not stable, so this is the one Kotlin kimney is
# built for. Every artifact below with `version.ref = "kotlin"` moves with it,
# and bumping it is a spec of its own (AGENTS.md, "Kotlin version").
kotlin = "2.4.10"
junit = "6.1.3"
kotest = "6.2.4"
ktlint = "1.8.0"

[libraries]
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-test-framework = { module = "org.jetbrains.kotlin:kotlin-compiler-internal-test-framework", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-script-runtime = { module = "org.jetbrains.kotlin:kotlin-script-runtime", version.ref = "kotlin" }
kotlin-annotations-jvm = { module = "org.jetbrains.kotlin:kotlin-annotations-jvm", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version = "4.13.2" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version = "8.10.0" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.9" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version = "0.18.1" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version = "5.6.5" }
# Publishing to the Central Portal, as pelican does; it wraps maven-publish and signing.
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
# The Gradle Plugin Portal, for the Gradle plugin alone.
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
